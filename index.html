<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таємниця зниклого Спільношколярика — математичний квест</title>
<meta name="description" content="Індивідуальний математичний детективний квест для 6 класу. Без оцінок, без рейтингу — тільки розслідування.">
<meta name="theme-color" content="#F88010">
<style>
/* ==========================================================================
   ТАЄМНИЦЯ ЗНИКЛОГО СПІЛЬНОШКОЛЯРИКА — styles
   Corporate palette: orange #F88010, dark gray #575551, lime #98C932
   ========================================================================== */

:root{
  --orange:#F88010;
  --orange-dark:#DE6E05;
  --gray:#575551;
  --gray-light:#8b8884;
  --lime:#98C932;
  --lime-dark:#7CAA22;
  --bg:#FAF9F6;
  --bg-card:#FFFFFF;
  --bg-soft:#F1EFE9;
  --ink:#3A3936;
  --ring:#F88010;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-soft:0 6px 18px rgba(87,85,81,0.12);
  --shadow-lift:0 12px 28px rgba(87,85,81,0.18);
  --font-body: 'Nunito', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  --font-display: 'Baloo 2', 'Nunito', 'Segoe UI', Roboto, system-ui, sans-serif;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

body{
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

h1,h2,h3{
  font-family: var(--font-display);
  margin:0 0 .4em 0;
  font-weight:800;
  color: var(--gray);
  letter-spacing:.2px;
}

p{ margin:0 0 .6em 0; }

button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  background:none;
  color:inherit;
}

button:focus-visible,
[tabindex]:focus-visible,
a:focus-visible{
  outline:3px solid var(--orange);
  outline-offset:2px;
  border-radius:8px;
}

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ---------- generic buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:.5em;
  padding:14px 26px;
  border-radius:999px;
  font-weight:700;
  font-size:1.02rem;
  background:var(--orange);
  color:#fff;
  box-shadow: var(--shadow-soft);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  min-height:48px;
}
.btn:hover{ transform: translateY(-2px); box-shadow: var(--shadow-lift); background:var(--orange-dark); }
.btn:active{ transform: translateY(0); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

.btn-secondary{
  background:var(--bg-card);
  color:var(--gray);
  border:2px solid var(--gray-light);
}
.btn-secondary:hover{ background:var(--bg-soft); border-color:var(--gray); }

.btn-ghost{
  background:transparent;
  color:var(--gray);
  border:2px solid transparent;
  padding:10px 18px;
}
.btn-ghost:hover{ background:var(--bg-soft); }

.btn-success{ background:var(--lime); color:#2c3a12; }
.btn-success:hover{ background:var(--lime-dark); color:#fff; }

.btn-sm{ padding:9px 16px; font-size:.9rem; min-height:38px; }

/* ---------- layout shells ---------- */
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding: 28px 18px 40px;
  text-align:center;
  animation: fadeIn .45s ease;
}

@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

.panel{
  background:var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  padding: 32px 28px;
  max-width: 560px;
  width:100%;
}

.eyebrow-dot{
  display:inline-flex; align-items:center; gap:8px;
  color:var(--orange-dark); font-weight:700; font-size:.85rem;
  margin-bottom:10px;
}
.eyebrow-dot::before{
  content:''; width:8px; height:8px; border-radius:50%; background:var(--orange);
  display:inline-block;
}

.mascots-row{
  display:flex; justify-content:center; align-items:flex-end; gap:6px;
  margin: 6px 0 18px;
}
.mascots-row img{ height:150px; width:auto; filter: drop-shadow(0 10px 14px rgba(87,85,81,.18)); }

.tagline{ color: var(--gray-light); font-size:.98rem; }

/* ---------- top bar (in-scene) ---------- */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
  background:var(--bg-card);
  border-bottom:1px solid var(--bg-soft);
  position:sticky; top:0; z-index:20;
}
.topbar .loc-title{
  font-family:var(--font-display);
  font-weight:800; color:var(--gray);
  font-size:1.05rem;
  flex:1;
  text-align:left;
  min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.icon-btn{
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-soft); color:var(--gray);
  font-size:1.2rem;
  flex-shrink:0;
  transition: background .15s ease, transform .15s ease;
  position:relative;
}
.icon-btn:hover{ background:#e7e3d8; transform:translateY(-1px); }
.icon-btn .badge{
  position:absolute; top:-4px; right:-4px;
  background:var(--orange); color:#fff;
  font-size:.65rem; font-weight:800;
  min-width:18px; height:18px; border-radius:999px;
  display:flex; align-items:center; justify-content:center;
  padding:0 4px;
}

.progress-wrap{
  padding: 10px 16px 4px;
  background:var(--bg-card);
}
.progress-label{
  font-size:.78rem; color:var(--gray-light); margin-bottom:5px; font-weight:700;
}
.progress-track{
  height:9px; border-radius:999px; background:var(--bg-soft); overflow:hidden;
}
.progress-fill{
  height:100%; background: linear-gradient(90deg, var(--lime), var(--orange));
  border-radius:999px; transition: width .5s ease;
}

/* ---------- scene stage ---------- */
.stage-wrap{
  flex:1;
  position:relative;
  padding:18px 16px 32px;
  max-width: 880px;
  width:100%;
  margin: 0 auto;
}

.scene-bg{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.scene-intro-text{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding:14px 18px;
  margin: 0 auto;
  max-width: 640px;
  font-size:1rem;
  color:var(--gray);
  box-shadow: var(--shadow-soft);
  text-align:center;
  white-space:pre-line;
}

/* ---------- illustrated scene + hotspots ---------- */
.illustration-wrap{
  position:relative;
  border-radius: var(--radius-lg);
  overflow:hidden;
  box-shadow: var(--shadow-soft);
  background:var(--bg-soft);
  line-height:0;
}
.illustration-wrap svg.scene-illustration{
  display:block;
  width:100%;
  height:auto;
}
.illustration-wrap svg.scene-illustration{
  display:block;
  width:100%;
  height:auto;
}
.scene-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:3 / 2;
  overflow:hidden;
  background:#e9e5dc;
}
.scene-image{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; display:block; user-select:none;
}
.scene-hotspot{
  position:absolute; z-index:4;
  transform:translate(-50%,-50%);
  width:var(--w); height:var(--h);
  border-radius:18px;
  background:transparent;
  border:2px solid transparent;
  transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.scene-hotspot:hover,.scene-hotspot:focus-visible{
  background:rgba(248,128,16,.13);
  border-color:rgba(248,128,16,.8);
  box-shadow:0 0 0 3px rgba(255,255,255,.55), 0 0 18px rgba(248,128,16,.45);
  transform:translate(-50%,-50%) scale(1.025);
}
.scene-hotspot.is-solved{
  border-color:rgba(152,201,50,.35);
}
.scene-hotspot .found-dot{
  position:absolute; right:6px; top:6px; width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--lime); color:#24310d; font-weight:900;
  box-shadow:0 4px 10px rgba(0,0,0,.18); opacity:0; transition:opacity .15s ease;
}
.scene-hotspot.is-solved .found-dot{opacity:1}
.scene-clues-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
.scene-clue{position:absolute;left:0;top:0;width:var(--w);height:var(--h);transform:translate(-50%,-50%) rotate(-2deg);pointer-events:none;border:0;border-radius:7px;padding:0 7px;background:#fffaf0;box-shadow:0 4px 12px rgba(0,0,0,.16);font:700 .72rem/1.15 Inter,system-ui,sans-serif;color:#575551;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,box-shadow .15s ease;}
.scene-clue::before{content:'';position:absolute;top:-5px;right:12px;width:18px;height:8px;border-radius:3px;background:rgba(248,128,16,.75);transform:rotate(4deg);}
.scene-clue.clue-lime::before{background:rgba(152,201,50,.9);}
.clue-paper-text{white-space:nowrap;}
.dashboard{max-width:1100px; width:100%; text-align:left}
.dashboard .panel{max-width:none}
.dashboard-head{display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap}
.dashboard-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin:18px 0}
.stat-card{background:var(--bg-soft); border-radius:14px; padding:16px}
.stat-card .value{font-size:1.7rem; font-weight:900; color:var(--gray)}
.report-table{width:100%; border-collapse:collapse; margin-top:16px; font-size:.9rem}
.report-table th,.report-table td{padding:10px 8px; border-bottom:1px solid #e3e0d8; text-align:left; vertical-align:top}
.report-table th{color:var(--gray); background:#faf9f6; position:sticky; top:0}
.report-code{width:100%; min-height:120px; border:2px solid #dedbd2; border-radius:12px; padding:12px; font:inherit; resize:vertical}
.report-code:focus{outline:3px solid rgba(248,128,16,.25); border-color:var(--orange)}
@media (max-width:700px){.report-table{font-size:.78rem}.report-table th:nth-child(5),.report-table td:nth-child(5){display:none}}
.hotspot{
  cursor:pointer;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform .16s ease, filter .16s ease;
  outline:none;
}
.hotspot:hover, .hotspot:focus-visible{
  transform: scale(1.035);
  filter: drop-shadow(0 0 7px rgba(248,128,16,0.65));
}
.hotspot:focus-visible{
  filter: drop-shadow(0 0 0 3px rgba(248,128,16,0.9)) drop-shadow(0 0 7px rgba(248,128,16,0.6));
}
.hotspot .hotspot-badge{
  opacity:0;
  transition: opacity .2s ease;
}
.hotspot.is-solved .hotspot-badge{ opacity:1; }

.exit-cta{
  margin: 4px auto 0;
  text-align:center;
}

.modal-icon{ font-size:2.6rem; line-height:1; margin-bottom:6px; }

/* ---------- dialogue bubble ---------- */
.dialogue-bar{
  position:relative; z-index:5;
  display:flex; align-items:flex-end; gap:12px;
  padding: 14px 16px 18px;
  max-width:880px; margin:0 auto; width:100%;
}
.dialogue-bar img.avatar{
  width:64px; height:64px; object-fit:contain; object-position:bottom;
  flex-shrink:0;
  filter: drop-shadow(0 6px 8px rgba(87,85,81,.2));
}
.dialogue-bubble{
  background:var(--bg-card);
  border-radius: var(--radius-md);
  border: 2px solid var(--bg-soft);
  padding:14px 16px;
  flex:1;
  box-shadow: var(--shadow-soft);
  text-align:left;
}
.dialogue-bubble .who{
  font-weight:800; font-size:.8rem; color:var(--orange-dark);
  margin-bottom:4px;
}
.dialogue-bubble .txt{ color:var(--gray); font-size:.98rem; }
.dialogue-bubble .btn{ margin-top:10px; }

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(58,57,54,0.55);
  display:flex; align-items:center; justify-content:center;
  padding:18px; z-index:100;
  animation: fadeIn .2s ease;
}
.modal-card{
  background:var(--bg-card);
  border-radius: var(--radius-lg);
  max-width: 480px; width:100%;
  max-height: 88vh; overflow-y:auto;
  padding: 26px 24px;
  box-shadow: var(--shadow-lift);
  text-align:center;
  position:relative;
}
.modal-card .close-x{
  position:absolute; top:12px; right:12px;
  width:36px; height:36px; border-radius:10px;
  background:var(--bg-soft); color:var(--gray);
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem;
}
.modal-card .close-x:hover{ background:#e7e3d8; }

.puzzle-story{
  font-size:.95rem; color:var(--gray-light);
  margin-bottom:14px;
}
.puzzle-question{
  font-family: var(--font-display);
  font-weight:800;
  font-size:1.5rem;
  color:var(--gray);
  margin: 10px 0 18px;
  line-height:1.35;
}
.puzzle-options{
  display:grid; grid-template-columns: 1fr 1fr; gap:10px;
  margin-bottom:14px;
}
.option-btn{
  background:var(--bg-soft);
  border:2px solid transparent;
  border-radius: var(--radius-sm);
  padding:14px 8px;
  font-weight:700; font-size:1.05rem; color:var(--gray);
  transition: border-color .15s ease, background .15s ease;
}
.option-btn:hover{ border-color:var(--orange); background:#fff; }

.puzzle-input-row{
  display:flex; gap:10px; justify-content:center; margin-bottom:14px;
  flex-wrap:wrap;
}
.puzzle-input{
  width:120px; padding:12px 14px; font-size:1.3rem; text-align:center;
  border-radius: var(--radius-sm); border:2px solid var(--bg-soft);
  font-weight:800; color:var(--gray);
  font-family:inherit;
}
.puzzle-input:focus{ border-color:var(--orange); outline:none; }

.feedback-msg{
  border-radius: var(--radius-sm);
  padding:10px 14px;
  font-weight:700;
  margin-bottom:12px;
  font-size:.95rem;
}
.feedback-msg.good{ background:#EDF6DC; color:#4d6a1c; }
.feedback-msg.bad{ background:#FCEFDD; color:#8a4e0c; }

.hint-box{
  background:#FCF6EC; border:1.5px dashed var(--orange);
  border-radius: var(--radius-sm); padding:10px 14px;
  font-size:.9rem; color:var(--gray); margin-bottom:12px; text-align:left;
}

.modal-actions{
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  margin-top:6px;
}

.reward-pop{
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.reward-pop .tile-big{
  font-size:3rem;
  background: linear-gradient(160deg, var(--lime), var(--lime-dark));
  color:#fff; width:84px; height:84px; border-radius:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-lift);
  font-family:var(--font-display); font-weight:900;
  animation: pop .5s ease;
}
@keyframes pop{ 0%{ transform:scale(.4) rotate(-8deg); opacity:0;} 70%{ transform:scale(1.08) rotate(3deg); opacity:1;} 100%{ transform:scale(1) rotate(0);} }

/* ---------- inventory drawer ---------- */
.inv-drawer{
  position:fixed; right:0; top:0; bottom:0;
  width:min(340px,92vw);
  background:var(--bg-card);
  box-shadow: -8px 0 24px rgba(87,85,81,.2);
  z-index:90;
  padding:22px 18px;
  transform: translateX(100%);
  transition: transform .28s ease;
  overflow-y:auto;
}
.inv-drawer.open{ transform:translateX(0); }
.inv-drawer h3{ display:flex; align-items:center; gap:8px; }
.inv-section{ margin-top:18px; }
.inv-section-title{ font-size:.78rem; font-weight:800; color:var(--gray-light); margin-bottom:8px; text-transform:none; }
.inv-tiles{ display:flex; gap:8px; flex-wrap:wrap; }
.inv-tile{
  width:52px; height:52px; border-radius:12px;
  background:var(--bg-soft); display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:1.2rem; font-weight:800; color:var(--gray); line-height:1.1;
  box-shadow: inset 0 0 0 2px rgba(152,201,50,.4);
}
.inv-tile-icon{ font-size:.7rem; }
.inv-empty{ color:var(--gray-light); font-size:.9rem; }
.inv-note{
  background:var(--bg-soft); border-radius:var(--radius-sm); padding:10px 12px;
  font-size:.86rem; color:var(--gray); margin-bottom:8px; text-align:left;
}
.drawer-backdrop{
  position:fixed; inset:0; background:rgba(58,57,54,.35); z-index:80;
}

/* ---------- meta puzzle (letters) ---------- */
.letters-tray, .letters-slots{
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  margin: 14px 0;
}
.letter-tile{
  width:56px; height:56px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:900; font-size:1.6rem;
  background: var(--orange); color:#fff;
  box-shadow: var(--shadow-soft);
  transition: transform .12s ease;
}
.letter-tile:hover{ transform: translateY(-3px); }
.letter-slot{
  width:56px; height:56px; border-radius:14px;
  border:2.5px dashed var(--gray-light);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:900; font-size:1.6rem;
  color:var(--gray); background:var(--bg-soft);
}
.letter-slot.filled{ border-style:solid; border-color:var(--lime); background:#fff; color:var(--gray); }

/* ---------- final search / victory ---------- */
.victory-badge{
  font-size:4rem; margin-bottom:6px;
}
.final-reveal-stage{
  position:relative; min-height:260px; display:flex; align-items:flex-end; justify-content:center;
  overflow:hidden; border-radius: var(--radius-lg);
}
.final-reveal-stage img{
  height:220px; position:relative; z-index:2;
  animation: riseUp .9s cubic-bezier(.2,.9,.25,1.1);
}
@keyframes riseUp{ from{ transform:translateY(60%); opacity:0;} to{ transform:translateY(0); opacity:1;} }

/* ---------- footer / util ---------- */
.footer-note{
  margin-top:22px; font-size:.8rem; color:var(--gray-light);
}
.link-btn{
  color:var(--gray-light); text-decoration:underline; font-size:.85rem; background:none;
}
.link-btn:hover{ color:var(--gray); }

.mode-select-grid{
  display:grid; gap:14px; margin-top:18px;
}

.confirm-box p{ color:var(--gray); }

@media (max-width: 560px){
  .mascots-row img{ height:110px; }
  .panel{ padding:26px 18px; }
  .puzzle-question{ font-size:1.25rem; }
  .puzzle-options{ grid-template-columns: 1fr 1fr; }
  .scene-intro-text{ font-size:.92rem; padding:12px 14px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

</style>
</head>
<body>
<div id="app" role="main" aria-live="polite"></div>
<noscript>
  <div style="padding:40px;text-align:center;font-family:sans-serif;color:#575551;">
    Для гри потрібен увімкнений JavaScript у браузері.
  </div>
</noscript>

function roomShell(scenePrefix, wallColor, floorColor, dim){

}

  const rows=4, rowH=h/rows;

  for(let i=0;i<rows;i++){

    const cols=[P.orange,P.lime,P.gray,'#B7815A','#7C97AE',P.orangeDark];

<script>
/* ==========================================================================
   ТАЄМНИЦЯ ЗНИКЛОГО СПІЛЬНОШКОЛЯРИКА — engine
   Plain JS, no framework, no backend. Everything lives in localStorage.
   ========================================================================== */

const SAVE_KEY = 'spilnoshkola_quest_save_v1';

/* ---------------------------------------------------------------------
   Student ID (?student=7 in the URL) — each student gets an isolated
   save slot and a reproducible seed, per teacher request.
   --------------------------------------------------------------------- */
const STUDENT_ID = (function(){
  try{
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('student');
    if(raw==null || raw==='') return null;
    const n = parseInt(raw, 10);
    return (!isNaN(n) && n>0) ? n : null;
  }catch(e){ return null; }
})();
function getSaveKey(){
  return STUDENT_ID!=null ? ('spilnoshkola_quest_student_' + STUDENT_ID) : SAVE_KEY;
}
const TEACHER_MODE = (function(){
  try{ return new URLSearchParams(window.location.search).get('teacher') === '1'; }catch(e){ return false; }
})();
const TEACHER_REPORTS_KEY = 'spilnoshkola_teacher_reports_v1';

/* ---------------------------------------------------------------------
   Seeded random helpers — same seed => same puzzle variants & shuffles
   --------------------------------------------------------------------- */
function hashStr(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seedInt){
  let a = seedInt >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rngFor(seed, salt){
  return mulberry32(hashStr(String(seed) + '::' + String(salt)));
}
function pickFrom(seed, salt, arr){
  const r = rngFor(seed, salt)();
  return arr[Math.floor(r * arr.length)];
}
function pickIntRange(seed, salt, min, max){
  const r = rngFor(seed, salt)();
  return min + Math.floor(r * (max - min + 1));
}
function shuffleWithSeed(seed, salt, arr){
  const rng = rngFor(seed, salt);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function makeSeed(){
  return 'seed_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1e9).toString(36);
}

/* ---------------------------------------------------------------------
   Default state
   --------------------------------------------------------------------- */
function freshState(){
  return {
    screen: 'MODE_SELECT',
    teacherStep: 0,
    seed: null,
    agentName: null,
    currentLocation: null,
    secretRoomMode: 'explore',
    solvedObjects: {},
    visitedObjects: {},
    letters: [],
    notes: [],
    mapFragments: 0,
    hintsUsedTotal: 0,
    milestones: [],
    metaTray: null,
    metaSlots: null,
    invOpen: false,
    muted: false,
    isGameCompleted: false,
    finalDialogueIndex: 0,
    startedAt: null,
    completedAt: null,
    stats: {attempts:0, correct:0, wrong:0, taskHistory:{}},
    lastInteraction: Date.now(),
  };
}

let state = freshState();
let activePuzzle = null;   // transient, not persisted
let uiFlash = null;        // transient toast text
let idleNudgeText = null;  // transient idle helper line
let idleTimer = null;
let pendingModal = null;   // {kind:'joke'|'note'|'flavor'|'poster'|'wrong'|'already'|'lockedExit'|'resetConfirm', ...}

function saveState(){
  try{
    localStorage.setItem(getSaveKey(), JSON.stringify(state));
  }catch(e){ /* storage unavailable — game still works for this session */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(getSaveKey());
    if(!raw) return null;
    return ensureStats(JSON.parse(raw));
  }catch(e){ return null; }
}
function hasRealProgress(s){
  return s && (s.screen === 'SCENE' || s.screen === 'META' || s.screen === 'FINAL_REVEAL' || s.screen === 'VICTORY');
}

/* ---------------------------------------------------------------------
   Tiny audio engine — synthesized, no external files
   --------------------------------------------------------------------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function beep(freq, startOffset, dur, type, gainPeak){
  const ctx = getAudioCtx();
  if(!ctx || state.muted) return;
  const t0 = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.12, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
const SFX = {
  click(){ beep(520, 0, 0.07, 'sine', 0.06); },
  correct(){ beep(660, 0, 0.12, 'triangle', 0.1); beep(880, 0.1, 0.18, 'triangle', 0.1); },
  wrong(){ beep(220, 0, 0.16, 'sine', 0.06); },
  unlock(){ beep(440, 0, 0.1, 'square', 0.05); beep(660, 0.08, 0.14, 'square', 0.05); },
  chest(){ beep(392, 0, 0.1, 'triangle', 0.08); beep(494, 0.09, 0.1, 'triangle', 0.08); beep(587, 0.18, 0.16, 'triangle', 0.08); },
  success(){ beep(523, 0, 0.1, 'triangle', 0.1); beep(659, 0.1, 0.1, 'triangle', 0.1); beep(784, 0.2, 0.22, 'triangle', 0.12); },
  reveal(){ beep(392, 0, 0.14, 'sine', 0.09); beep(523, 0.12, 0.14, 'sine', 0.09); beep(659, 0.24, 0.14, 'sine', 0.09); beep(784, 0.36, 0.3, 'sine', 0.12); },
};

/* ---------------------------------------------------------------------
   Utility
   --------------------------------------------------------------------- */
function touchInteraction(){ state.lastInteraction = Date.now(); idleNudgeText = null; }
function addMilestone(key){
  if(!state.milestones.includes(key)) state.milestones.push(key);
}
function coreTaskObjects(){
  const kinds = new Set(['puzzle','ruler_puzzle','sequence_puzzle','percent_puzzle','triple_puzzle']);
  return Object.values(SCENES).flatMap(scene=>scene.objects.filter(o=>kinds.has(o.kind)));
}
function coreTaskCount(){ return coreTaskObjects().length; }
function solvedCoreTaskCount(){ return coreTaskObjects().filter(o=>state.solvedObjects[o.id]).length; }
function progressPercent(){
  if(state.isGameCompleted) return 100;
  return Math.round((solvedCoreTaskCount()/coreTaskCount())*100);
}
function ensureStats(s){
  if(!s.stats) s.stats={attempts:0,correct:0,wrong:0,taskHistory:{}};
  if(!s.stats.taskHistory) s.stats.taskHistory={};
  if(typeof s.stats.attempts!=='number') s.stats.attempts=0;
  if(typeof s.stats.correct!=='number') s.stats.correct=0;
  if(typeof s.stats.wrong!=='number') s.stats.wrong=0;
  return s;
}
function letterOf(letterIdChar){ return letterIdChar; }

function variantFor(objectId, poolName){
  const pool = PUZZLE_POOLS[poolName];
  const idx = hashStr(state.seed + '::' + objectId) % pool.length;
  return pool[idx];
}
function findObject(locationId, objectId){
  return SCENES[locationId].objects.find(o=>o.id===objectId);
}
function objectDone(id){ return !!state.solvedObjects[id]; }
function findObjectAnyScene(objectId){
  for(const locId in SCENES){
    const o = SCENES[locId].objects.find(x=>x.id===objectId);
    if(o) return {loc:locId, obj:o};
  }
  return null;
}

/* ---------------------------------------------------------------------
   TEACHER REPORTS — no backend required. Students copy a compact report
   from their device; the teacher pastes it into ?teacher=1.
   For true live sync across devices, connect this layer to a backend later.
   --------------------------------------------------------------------- */
function reportEncode(obj){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }catch(e){ return ''; }
}
function reportDecode(code){
  try{ return JSON.parse(decodeURIComponent(escape(atob(code.trim())))); }catch(e){ return null; }
}
function makeStudentReport(){
  ensureStats(state);
  const solved = solvedCoreTaskCount();
  const total = coreTaskCount();
  return {
    version:3, studentId:STUDENT_ID, agentName:state.agentName || (STUDENT_ID ? `АГЕНТ №${STUDENT_ID}` : 'Без номера'),
    seed:state.seed, progress:state.isGameCompleted?100:Math.round(solved/total*100), solved, total,
    attempts:state.stats.attempts, correct:state.stats.correct, wrong:state.stats.wrong, hints:state.hintsUsedTotal||0,
    location:state.currentLocation, completed:!!state.isGameCompleted,
    startedAt:state.startedAt||null, completedAt:state.completedAt||null,
    taskHistory:state.stats.taskHistory||{}
  };
}

/* ---------------------------------------------------------------------
   Render root
   --------------------------------------------------------------------- */
function render(){
  const root = document.getElementById('app');
  if(TEACHER_MODE){ root.innerHTML=''; root.appendChild(renderTeacherDashboard()); return; }
  root.innerHTML = '';
  switch(state.screen){
    case 'MODE_SELECT': root.appendChild(renderModeSelect()); break;
    case 'TEACHER_INTRO': root.appendChild(renderTeacherIntro()); break;
    case 'START': root.appendChild(renderStartScreen()); break;
    case 'AGENT_SETUP': root.appendChild(renderAgentSetup()); break;
    case 'SCENE': root.appendChild(renderSceneScreen()); break;
    case 'META': root.appendChild(renderMetaPuzzle()); break;
    case 'FINAL_REVEAL': root.appendChild(renderFinalReveal()); break;
    case 'VICTORY': root.appendChild(renderVictory()); break;
    default: root.appendChild(renderModeSelect());
  }
  if(pendingModal) root.appendChild(renderModalHost());
  if(activePuzzle) root.appendChild(renderPuzzleModal());
  if(state.invOpen && (state.screen==='SCENE' || state.screen==='META')) root.appendChild(renderInventory());
  saveState();
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs){
    for(const k in attrs){
      if(k === 'text'){ e.textContent = attrs[k]; }
      else if(k === 'html'){ e.innerHTML = attrs[k]; }
      else if(k.startsWith('on') && typeof attrs[k]==='function'){ e.addEventListener(k.slice(2).toLowerCase(), attrs[k]); }
      else if(k === 'class'){ e.className = attrs[k]; }
      else { e.setAttribute(k, attrs[k]); }
    }
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}
function textEl(tag, cls, text){ return el(tag, {class:cls, text:text}); }

/* ---------------------------------------------------------------------
   Object click dispatch
   --------------------------------------------------------------------- */
function handleObjectClick(locationId, obj){
  SFX.click();
  state.visitedObjects[obj.id] = true;

  if(state.solvedObjects[obj.id] && ['puzzle','ruler_puzzle','sequence_puzzle','percent_puzzle','triple_puzzle'].includes(obj.kind)){
    pendingModal = { kind:'already', text:'Ти вже розгадав цю загадку. Можеш рухатися далі.', icon: obj.icon };
    render(); return;
  }

  switch(obj.kind){
    case 'puzzle': openPuzzle(locationId, obj, 'input_or_mcq'); return;
    case 'ruler_puzzle': openPuzzle(locationId, obj, 'ruler'); return;
    case 'sequence_puzzle': openPuzzle(locationId, obj, 'sequence'); return;
    case 'percent_puzzle': openPuzzle(locationId, obj, 'percent'); return;
    case 'triple_puzzle': openPuzzle(locationId, obj, 'triple'); return;
    case 'safe_puzzle': openPuzzle(locationId, obj, 'safe'); return;

    case 'joke':
      pendingModal = { kind:'joke', text: obj.text, icon: obj.icon };
      render(); return;

    case 'note':
      if(obj.note && !state.notes.includes(obj.note)) state.notes.push(obj.note);
      pendingModal = { kind:'note', text: obj.text, icon: obj.icon };
      render(); return;

    case 'flavor':
      pendingModal = { kind:'flavor', text: obj.text, icon: obj.icon };
      render(); return;

    case 'poster':{
      const fact = pickFrom(state.seed, obj.id, POSTER_FACTS);
      pendingModal = { kind:'poster', title: obj.title, text: fact, icon: obj.icon };
      render(); return;
    }

    case 'exit_hint':{
      const scene = SCENES[locationId];
      const ready = scene.exitRequires.every(objectDone);
      pendingModal = ready
        ? { kind:'exitReady', text: obj.text, exitLabel: scene.exitLabel, locationId: locationId, icon: obj.icon }
        : { kind:'lockedExit', text: obj.lockedText, icon: obj.icon };
      render(); return;
    }

    case 'map':{
      const scene = SCENES[locationId];
      const ready = scene.exitRequires.every(objectDone);
      pendingModal = ready
        ? { kind:'map' }
        : { kind:'lockedExit', text: scene.exitHint, icon: obj.icon };
      render(); return;
    }

    case 'search_or_flavor':{
      if(state.secretRoomMode === 'search'){
        pendingModal = { kind:'wrong', text: obj.wrongText, icon: obj.icon };
      } else {
        pendingModal = { kind:'flavor', text: obj.flavorText, icon: obj.icon };
      }
      render(); return;
    }

    case 'final_desk':{
      if(state.secretRoomMode === 'search'){
        SFX.reveal();
        state.finalDialogueIndex = 0;
        addMilestone('victory');
        state.screen = 'FINAL_REVEAL';
      } else {
        pendingModal = { kind:'flavor', text: obj.flavorText, icon: obj.icon };
      }
      render(); return;
    }
  }
}

/* ---------------------------------------------------------------------
   PUZZLE MODAL — handles all puzzle kinds
   --------------------------------------------------------------------- */
function openPuzzle(locationId, obj, mode){
  const variant = obj.pool ? variantFor(obj.id, obj.pool) : null;
  activePuzzle = {
    locationId, objId: obj.id, obj, mode, variant,
    hintLevel: 0, wrong:false, solved:false, tripleIndex:0, inputValue:'',
  };
  render();
  setTimeout(()=>{ const inp = document.querySelector('.puzzle-input'); if(inp) inp.focus(); }, 30);
}

function closePuzzle(){ activePuzzle = null; render(); }

function computePuzzleDisplay(){
  const p = activePuzzle;
  const v = p.variant;
  if(p.mode === 'ruler'){
    return { story: p.obj.storyIn, question: `Відрізок має довжину ${v.base} см.\nДругий відрізок у 2 рази довший.\nЯка його довжина?`, type:'input', answer: v.a, h1:'Подумай, що означає «у 2 рази довший».', h2:`${v.base} × 2 = ${v.a}.` };
  }
  if(p.mode === 'sequence'){
    const seqStr = v.seq.join(', ');
    return { story: p.obj.storyIn, question: `${seqStr}, ?`, type:'input', answer: v.a, h1:'Подивись, на скільки збільшується кожне наступне число.', h2:`Крок між числами: ${v.seq[1]-v.seq[0]}.` };
  }
  if(p.mode === 'percent'){
    return { story: p.obj.storyIn, question: `${v.pct}% від ${v.of} = ?`, type:'input', answer: v.a, h1: v.h1 || 'Спробуй спочатку знайти 10% від числа.', h2: v.h2 || `${v.pct}% від ${v.of} = ${v.a}.` };
  }
  if(p.mode === 'safe'){
    return { story: p.obj.storyIn, question: v.clue, type:'input', answer: v.a, h1:'Перевір кожну умову по черзі.', h2:`Число, що підходить під усі умови: ${v.a}.` };
  }
  if(p.mode === 'triple'){
    const task = v[p.tripleIndex];
    return { story: `Задача ${p.tripleIndex+1} з 3`, question: task.q, type: task.type==='mcq' ? 'mcq' : 'input', options: task.options, answer: task.a, h1:'Розв\u2019яжи крок за кроком.', h2:'Перевір обчислення ще раз.' };
  }
  // input_or_mcq — classroom/corridor style puzzles from pools
  if(v.type === 'mcq'){
    return { story: p.obj.storyIn, question: v.q, type:'mcq', options: v.options, answer: v.a, h1: v.h1, h2: v.h2 };
  }
  if(v.sq !== undefined){
    const seq = v.seq;
    const lines = seq.map(n=>`${n} → ${n*n}`).join(',  ');
    const nextN = seq[seq.length-1]+1;
    return { story: p.obj.storyIn, question: `${lines},  ${nextN} → ?`, type:'input', answer: v.a, h1:v.h1, h2:v.h2 };
  }
  if(v.now !== undefined){
    return { story: p.obj.storyIn, question: `Зараз ${v.now}.\nСкільки хвилин залишилося до ${v.target}?`, type:'input', answer: v.a, h1:'Полічи хвилини до найближчої рівної години.', h2:`До ${v.target} залишилось ${v.a} хвилин.` };
  }
  if(v.start !== undefined){
    const a1=v.start, a2=v.start+v.step, a3=v.start+2*v.step, a4=v.start+3*v.step;
    return { story: p.obj.storyIn, question: `${a1}, ${a2}, ${a3}, ${a4}, ?`, type:'input', answer: v.a, h1:'Подивись, на скільки збільшується кожне наступне число.', h2:`Кожного разу додається ${v.step}.` };
  }
  return { story: p.obj.storyIn, question: v.q, type:'input', answer: v.a, h1: v.h1, h2: v.h2 };
}

function checkAnswer(userValue, display){
  if(display.type === 'mcq') return userValue === display.answer;
  const num = parseFloat(String(userValue).replace(',', '.').trim());
  return !isNaN(num) && num === display.answer;
}

function onPuzzleSubmit(userValue){
  const p = activePuzzle;
  const display = computePuzzleDisplay();
  const ok = checkAnswer(userValue, display);
  ensureStats(state);
  state.stats.attempts++;
  const h = state.stats.taskHistory[p.objId] || {attempts:0,correct:0,hints:0};
  h.attempts++;
  state.stats.taskHistory[p.objId] = h;
  if(ok){
    state.stats.correct++; h.correct++;
    SFX.correct();
    p.wrong = false;
    if(p.mode === 'triple' && p.tripleIndex < p.variant.length - 1){
      p.tripleIndex++;
      render();
      return;
    }
    finishPuzzleSuccess();
  } else {
    SFX.wrong();
    state.stats.wrong++;
    p.wrong = true;
    render();
  }
}

function finishPuzzleSuccess(){
  const p = activePuzzle;
  const obj = p.obj;
  state.solvedObjects[obj.id] = true;
  p.solved = true;

  if(obj.id === 'korobka') { state.mapFragments++; SFX.chest(); }
  if(obj.id === 'computer'){ SFX.unlock(); addMilestone('solve_computer'); }
  if(obj.id === 'bloknot') state.mapFragments++;
  if(obj.id === 'skrynya') SFX.chest();

  if(obj.giveLetter){
    state.letters.push(obj.giveLetter);
    if(obj.giveLetter==='П') addMilestone('letter_П');
    if(obj.giveLetter==='А' && !state.milestones.includes('letter_А1')) addMilestone('letter_А1');
    else if(obj.giveLetter==='А') addMilestone('letter_А2');
    if(obj.giveLetter==='Р') addMilestone('letter_Р');
    if(obj.giveLetter==='Т') addMilestone('letter_Т');
  }
  if(obj.id === 'ryukzak') addMilestone('clue_ryukzak');
  if(obj.note && !state.notes.includes(obj.note)) state.notes.push(obj.note);

  render();
}

function useHint(){
  const p = activePuzzle;
  if(p.hintLevel < 2){ p.hintLevel++; state.hintsUsedTotal++; ensureStats(state); const h=state.stats.taskHistory[p.objId] || {attempts:0,correct:0,hints:0}; h.hints++; state.stats.taskHistory[p.objId]=h; }
  render();
}

  if(p.wrong){
    card.appendChild(textEl('div','feedback-msg bad', pickFrom(state.seed, 'wrongmsg'+p.hintLevel+Date.now()%7, [

    row.appendChild(input);

  }
  card.appendChild(actions);

  overlay.appendChild(card);
  return overlay;
}

/* ---------------------------------------------------------------------
   META PUZZLE — assemble letters into ПАРТА
   --------------------------------------------------------------------- */
function setupMetaPuzzle(){
  if(state.metaTray && state.metaSlots) return;
  const tiles = state.letters.map((L,i)=>({id:'t'+i, letter:L}));
  state.metaTray = shuffleWithSeed(state.seed, 'metashuffle', tiles).map(t=>t.id);
  state._metaTileMap = null; // recomputed on render
  state.metaSlots = new Array(FINAL_WORD.length).fill(null);
  state._metaTiles = tiles; // {id,letter}
}

function tileLetter(tileId){
  const t = (state._metaTiles||[]).find(x=>x.id===tileId);
  return t ? t.letter : '?';
}

function renderMetaPuzzle(){
  if(!state._metaTiles){
    const tiles = state.letters.map((L,i)=>({id:'t'+i, letter:L}));
    state._metaTiles = tiles;
  }
  const wrap = el('div',{class:'screen'});
  const panel = el('div',{class:'panel'});
  panel.appendChild(textEl('h2',null,'Склади таємне слово'));
  panel.appendChild(textEl('p',null,'Ти зібрав усі фрагменти. Розмісти їх у правильному порядку.'));

  const slotsWrap = el('div',{class:'letters-slots'});
  state.metaSlots.forEach((tileId, idx)=>{
    const filled = !!tileId;
    const slot = el('button',{
      class:'letter-slot' + (filled?' filled':''),
      'aria-label': filled ? `Місце ${idx+1}: літера ${tileLetter(tileId)}, натисни щоб повернути` : `Порожнє місце ${idx+1}`,
      onclick: ()=>{
        if(filled){
          state.metaTray.push(tileId);
          state.metaSlots[idx] = null;
          render();
        }
      }
    },[ textEl('span',null, filled ? tileLetter(tileId) : '') ]);
    slotsWrap.appendChild(slot);
  });
  panel.appendChild(slotsWrap);

  const trayWrap = el('div',{class:'letters-tray'});
  state.metaTray.forEach(tileId=>{
    trayWrap.appendChild(el('button',{
      class:'letter-tile',
      'aria-label': `Літера ${tileLetter(tileId)}, натисни щоб розмістити`,
      onclick: ()=>{
        const emptyIdx = state.metaSlots.findIndex(s=>s===null);
        if(emptyIdx===-1) return;
        state.metaSlots[emptyIdx] = tileId;
        state.metaTray = state.metaTray.filter(id=>id!==tileId);
        SFX.click();
        render();
      }
    },[ textEl('span',null, tileLetter(tileId)) ]));
  });
  panel.appendChild(trayWrap);

  const allFilled = state.metaSlots.every(s=>s!==null);
  if(allFilled){
    const word = state.metaSlots.map(tileLetter).join('');
    if(word === FINAL_WORD){
      panel.appendChild(textEl('div','feedback-msg good', `🎉 «${word}»! Здається, це не просто слово. Це підказка.`));
      panel.appendChild(el('button',{class:'btn btn-success', onclick:()=>{
          addMilestone('word_assembled');
          state.secretRoomMode = 'search';
          state.screen = 'SCENE';
          render();
        }, text:'ПОВЕРНУТИСЯ В КІМНАТУ'}));
    } else {
      panel.appendChild(textEl('div','feedback-msg bad', `🤔 «${word}»... щось не сходиться. Спробуй іншу комбінацію.`));
      panel.appendChild(el('button',{class:'btn btn-secondary btn-sm', onclick:()=>{
          state.metaTray = state.metaTray.concat(state.metaSlots.filter(Boolean));
          state.metaSlots = new Array(FINAL_WORD.length).fill(null);
          render();
        }, text:'Розкласти знову'}));
    }
  }

  wrap.appendChild(panel);
  return wrap;
}

}

/* ---------------------------------------------------------------------
   Idle nudge — Спільношколярка gently hints if nothing happens for a while
   --------------------------------------------------------------------- */
function startIdleWatcher(){
  if(idleTimer) clearInterval(idleTimer);
  idleTimer = setInterval(()=>{
    if(state.screen !== 'SCENE') return;
    if(pendingModal || activePuzzle) return;
    if(state.invOpen) return;
    const idleFor = Date.now() - state.lastInteraction;
    if(idleFor > 42000 && !idleNudgeText){
      idleNudgeText = pickFrom(state.seed || 'x', 'idle'+Math.floor(Date.now()/60000), HELPER_LINES);
      render();
    }
  }, 4000);
}

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
function boot(){
  if(TEACHER_MODE){ render(); return; }
  const saved = loadState();
  if(saved && saved.isGameCompleted){
    state = Object.assign(freshState(), saved);
    state._metaTiles = null;
    render(); startIdleWatcher();
    return;
  }
  if(hasRealProgress(saved)){
    // ask to resume
    const root = document.getElementById('app');
    root.innerHTML = '';
    const wrap = el('div',{class:'screen'});
    const panel = el('div',{class:'panel'});
    panel.appendChild(el('div',{class:'mascots-row'},[el('img',{src:GIRL_FULL, alt:''}), el('img',{src:BOY_FULL, alt:''})]));
    panel.appendChild(textEl('h2',null,'Продовжити розслідування?'));
    panel.appendChild(textEl('p','tagline','Здається, ти вже був на слідстві.'));
    const grid = el('div',{class:'mode-select-grid'});
    grid.appendChild(el('button',{class:'btn', onclick:()=>{
        state = Object.assign(freshState(), saved);
        state._metaTiles = null;
        render(); startIdleWatcher();
      }, text:'ПРОДОВЖИТИ'}));
    grid.appendChild(el('button',{class:'btn btn-secondary', onclick:()=>{
        try{ localStorage.removeItem(getSaveKey()); }catch(e){}
        state = freshState();
        render(); startIdleWatcher();
      }, text:'ПОЧАТИ ЗАНОВО'}));
    panel.appendChild(grid);
    wrap.appendChild(panel);
    root.appendChild(wrap);
    return;
  }
  render();
  startIdleWatcher();
}

document.addEventListener('DOMContentLoaded', boot);

</script>
