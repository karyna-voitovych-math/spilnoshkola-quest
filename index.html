<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Таємниця зниклого Спільношколярика</title><meta name="theme-color" content="#F88010"><style>
:root{--orange:#F88010;--gray:#575551;--lime:#98C932;--bg:#FAF9F6;--ink:#3A3936;--soft:#F1EFE9;--shadow:0 10px 30px rgba(87,85,81,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh}.wrap{width:min(1100px,94vw);margin:auto;padding:22px 0 40px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.brand{font-weight:900;color:var(--gray)}.brand span{color:var(--orange)}h1,h2,h3{font-family:'Trebuchet MS','Segoe UI',sans-serif;color:var(--gray);margin:0 0 10px;font-weight:900}h1{font-size:clamp(30px,5vw,52px);line-height:1.05}h2{font-size:clamp(25px,4vw,36px)}p{line-height:1.55}.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:900;background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(248,128,16,.2);transition:.15s}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:#fff;color:var(--gray);border:2px solid #d9d6d0;box-shadow:none}.btn.lime{background:var(--lime)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.hero{min-height:100vh;display:grid;place-items:center;padding:25px}.hero-card{width:min(950px,100%);background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:clamp(25px,5vw,55px);overflow:hidden}.mascots{display:flex;align-items:end;justify-content:center;gap:25px;margin-bottom:15px}.mascots img{max-height:190px;max-width:36%;object-fit:contain}.intro{font-size:18px;max-width:720px;margin:0 auto 20px;text-align:center}.center{text-align:center}.notice{background:var(--soft);border-radius:16px;padding:14px 18px;margin:18px 0;font-weight:700}.agent{display:flex;gap:10px;justify-content:center;align-items:center;margin:15px 0;flex-wrap:wrap}.agent input{width:110px;text-align:center;border:2px solid #ddd8cf;border-radius:14px;padding:10px}.room-head{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.room-story{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:center}.scene{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:18px;display:block}.story p{font-size:17px}.letter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.letter{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-size:20px;font-weight:900;color:#b4b0aa}.letter.found{background:var(--lime);color:#fff}.progress{height:9px;background:#e7e3dc;border-radius:20px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--orange);border-radius:20px}.stages{display:grid;gap:14px}.stage{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:19px;display:flex;align-items:center;justify-content:space-between;gap:15px}.stage.locked{opacity:.55}.stage-info{display:flex;gap:14px;align-items:center}.stage-num{width:46px;height:46px;border-radius:15px;background:#fff1e7;color:var(--orange);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}.stage.done .stage-num{background:#eaf5d6;color:var(--lime)}.stage small{color:#77736d}.modal-backdrop{position:fixed;inset:0;background:rgba(45,43,39,.42);display:grid;place-items:center;padding:15px;z-index:20}.modal{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:25px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:24px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.close{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:24px;color:var(--gray)}.task{border:2px solid #eee9e1;border-radius:18px;padding:18px;margin:15px 0}.task.done{border-color:#cfe5a8;background:#fbfdf6}.task-num{font-size:13px;font-weight:900;color:var(--orange);text-transform:uppercase}.question{font-size:19px;font-weight:800;margin:8px 0 14px;white-space:pre-line}.answer-row{display:flex;gap:9px;flex-wrap:wrap}.answer-row input{flex:1;min-width:150px;border:2px solid #d9d6d0;border-radius:13px;padding:11px 13px}.feedback{font-weight:800;margin-top:9px;min-height:24px}.feedback.ok{color:#6b9a18}.feedback.no{color:#b65d2c}.hint{color:var(--gray);background:var(--soft);border-radius:12px;padding:9px 12px;margin-top:9px;font-size:14px}.reward{text-align:center;background:#fbfdf6;border:2px solid #dcebc1;border-radius:20px;padding:22px;margin-top:18px}.reward-letter{font-size:48px;font-weight:1000;color:var(--lime)}.room-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}.inline-stage{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px}.inline-stage.locked{opacity:.55}.inline-stage-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}.inline-stage-head .stage-num{width:42px;height:42px}.inline-stage.done{border:2px solid #dcebc1}.inline-stage h3{margin-bottom:4px}.room-complete{background:#fbfdf6;border:2px solid #dcebc1;border-radius:20px;padding:20px;text-align:center;margin-top:18px}.room-complete .reward-letter{font-size:42px}.final-card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:30px;text-align:center}.word-input{font-size:30px;text-transform:uppercase;letter-spacing:7px;text-align:center;max-width:330px;width:100%;padding:13px;border:3px solid #ddd8cf;border-radius:16px;margin:12px 0}.found-boy{max-height:300px;max-width:70%;object-fit:contain;margin:5px auto 10px;display:block}@media(max-width:760px){.room-story{grid-template-columns:1fr}.stage{align-items:flex-start;flex-direction:column}.stage .btn{width:100%}.mascots img{max-height:140px}.modal{padding:18px}}

const ORDER=['classroom','corridor','office','secretroom'];const FINAL_WORD='ПАРТА';const SAVE_KEY='spilnoshkola_simple_quest_v3_'+((parseInt(new URLSearchParams(location.search).get('student')||'',10)>0)?parseInt(new URLSearchParams(location.search).get('student'),10):'default');
function fresh(){return {screen:'start',room:0,completed:{},letters:[],agent:'',attempts:0,hints:0,final:false}}
let state=fresh();try{const x=localStorage.getItem(SAVE_KEY);if(x)state=Object.assign(fresh(),JSON.parse(x))}catch(e){}function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function el(tag,attrs={},children=[]){const x=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')x.textContent=v;else if(k==='html')x.innerHTML=v;else if(k==='class')x.className=v;else if(k.startsWith('on'))x.addEventListener(k.slice(2),v);else if(k==='ariaLabel')x.setAttribute('aria-label',v);else if(v!=null)x.setAttribute(k,v)}children.forEach(c=>x.append(c));return x}
function norm(s){return String(s).trim().toUpperCase().replaceAll(' ','').replaceAll(',','.')}function correct(v,a){return norm(v)===norm(a)}function current(){return SCENES[ORDER[state.room]]}function roomDone(sc){return sc.stages.every(s=>!!state.completed[s.id])}function doneCount(){return Object.keys(state.completed).length}function pct(){return Math.round(doneCount()/5*100)}
function render(){const app=document.getElementById('app');app.innerHTML='';if(state.screen==='start')startScreen(app);else if(state.screen==='room')roomScreen(app);else finalScreen(app)}
function startScreen(app){const hero=el('div',{class:'hero'}),card=el('div',{class:'hero-card'});card.append(el('div',{class:'mascots'},[el('img',{src:GIRL_FULL,alt:'Спільношколярка'}),el('img',{src:BOY_FULL,alt:'Спільношколярик'})]));card.append(el('div',{class:'center'},[el('h1',{text:'Таємниця зниклого Спільношколярика'}),el('p',{class:'intro',text:'Пройди чотири кімнати, розв’яжи математичні рівні, збери літери й розкрий таємницю.'})]));card.append(el('div',{class:'notice',text:'Це не оцінка і не змагання. Помилка — це просто ще одна спроба. Читай умову, міркуй і рухайся у своєму темпі.'}));const row=el('div',{class:'agent'});row.append(el('span',{text:'Твій номер агента:'}));const inp=el('input',{placeholder:'№',value:new URLSearchParams(location.search).get('student')||state.agent||''});row.append(inp);card.append(row);card.append(el('div',{class:'center'},[el('button',{class:'btn',text:'ПОЧАТИ РОЗСЛІДУВАННЯ',onclick:()=>{state.agent=inp.value.trim()||'Агент';state.screen='room';state.room=0;save();render()}})]));hero.append(card);app.append(hero)}
function top(){return el('div',{class:'top'},[el('div',{class:'brand',html:'СПІЛЬНО<span>ШКОЛА</span> · математичний квест'}),el('div',{text:`Агент ${state.agent||'—'} · ${pct()}%`})])}
function roomScreen(app){
  const sc=current(), wrap=el('div',{class:'wrap'});

  wrap.append(head);

  const list=el('div',{class:'stages'});
  sc.stages.forEach((stage,i)=>renderInlineStage(list,sc,stage,i));
  wrap.append(list);

  if(roomDone(sc)){
    const box=el('div',{class:'room-complete'});
    box.append(el('div',{text:'Клас! Цю кімнату пройдено.'}));
    box.append(el('div',{class:'reward-letter',text:sc.stages[sc.stages.length-1].letter}));
    box.append(el('p',{text:'Літеру додано до твого набору. Рухайся далі.'}));
    if(state.room<ORDER.length-1) box.append(el('button',{class:'btn lime',text:'Перейти до наступної кімнати →',onclick:()=>{state.room++;save();render()}}));
    else box.append(el('button',{class:'btn lime',text:'Зібрати фінальне слово →',onclick:()=>{state.screen='final';save();render()}}));
    wrap.append(box);
  }
  app.append(wrap);
}

function renderInlineStage(list,sc,stage,i){
  const previousDone=i===0||!!state.completed[sc.stages[i-1].id];
  const done=!!state.completed[stage.id];
  const box=el('section',{class:'inline-stage'+(done?' done':'')+(previousDone?'':' locked')});
  const head=el('div',{class:'inline-stage-head'});
  head.append(el('div',{class:'stage-num',text:done?'✓':String(i+1)}));
  head.append(el('div',{},[el('h3',{text:stage.title}),el('small',{text:stage.desc})]));
  box.append(head);

  if(!previousDone && !done){
    box.append(el('p',{text:'Спочатку заверши попередній рівень. Наступний відкриється автоматично.'}));
    list.append(box); return;
  }

  stage.tasks.forEach((t,j)=>{
    const alreadyDone=done;
    const task=el('div',{class:'task'+(alreadyDone?' done':'')});
    task.append(el('div',{class:'task-num',text:`Завдання ${j+1}`}));
    task.append(el('div',{class:'question',text:t.q}));
    const input=el('input',{type:'text',autocomplete:'off',placeholder:'Твоя відповідь',disabled:alreadyDone});
    const check=el('button',{class:'btn',text:alreadyDone?'✓ Правильно':'Перевірити',disabled:alreadyDone});
    const hintBtn=el('button',{class:'btn secondary',text:'💡 Підказка',disabled:alreadyDone});
    const feedback=el('div',{class:'feedback'});
    const hint=el('div',{class:'hint',text:'Підказка: '+t.hint});
    hint.style.display='none';
    hintBtn.onclick=()=>{hint.style.display='block';state.hints++;save()};
    check.onclick=()=>{
      state.attempts++;
      if(correct(input.value,t.a)){
        input.disabled=true; check.disabled=true; hintBtn.disabled=true;
        check.textContent='✓ Правильно';
        feedback.className='feedback ok'; feedback.textContent='✓ Правильно!';
        task.classList.add('done');
        t._done=true;
        const allDone=stage.tasks.every(x=>x._done || done);
        if(allDone){
          state.completed[stage.id]=true;
          if(!state.letters.includes(stage.letter)) state.letters.push(stage.letter);
          save();
          setTimeout(render,120);
        } else save();
      }else{
        feedback.className='feedback no'; feedback.textContent='Ще одна спроба — перевір обчислення.';
        save();
      }
    };
    input.addEventListener('keydown',e=>{if(e.key==='Enter')check.click()});
    const row=el('div',{class:'answer-row'});row.append(input,check,hintBtn);
    task.append(row,feedback,hint);box.append(task);
  });
  list.append(box);
}

function finalScreen(app){
  const wrap=el('div',{class:'wrap'});wrap.append(top());
  const card=el('div',{class:'final-card'});
  card.append(el('h1',{text:'Фінальний секрет'}),el('p',{text:'Ти пройшов усі математичні рівні. Склади зібрані літери й введи слово.'}));
  const letters=el('div',{class:'letter-bar',style:'justify-content:center;margin:20px 0'});
  state.letters.forEach(l=>letters.append(el('div',{class:'letter found',text:l})));
  card.append(letters);
  if(state.final){
    card.append(el('img',{class:'found-boy',src:BOY_FULL,alt:'Спільношколярик'}),el('h2',{text:'Вау! Ти розкрив таємницю!'}),el('p',{class:'intro',text:'Спільношколярик ховався саме в таємній кімнаті. Клас! Ти завершив квест. Ти уважно читав умови, міркував і знаходив рішення.'}),el('button',{class:'btn',text:'Пройти ще раз',onclick:()=>{state=fresh();save();render()}}));
  }else{
    const inp=el('input',{class:'word-input',maxlength:'5',placeholder:'ПАРТА'}),fb=el('div',{class:'feedback'});
    const btn=el('button',{class:'btn',text:'ПЕРЕВІРИТИ СЛОВО',onclick:()=>{if(norm(inp.value)===FINAL_WORD){state.final=true;save();render()}else{fb.className='feedback no';fb.textContent='Майже! Подивись на зібрані літери ще раз.'}}});
    card.append(inp,el('br'),btn,fb)
  }
  wrap.append(card);app.append(wrap)
}
render();
</script></body></html>
