<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Таємниця зниклого Спільношколярика</title>
<style>
:root{--o:#F88010;--g:#575551;--l:#98C932;--b:#FAF9F6}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--g);font-family:Arial,sans-serif}
main{min-height:100vh;padding:26px 16px 60px}.wrap{max-width:920px;margin:auto}
.card{background:#fff;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 7px 25px #57555118}
h1{color:var(--o);font-size:clamp(28px,5vw,46px);margin:0 0 14px}h2{font-size:30px;margin:0 0 8px}h3{font-size:21px;margin:0 0 10px}
p{font-size:18px;line-height:1.5}.scene{width:100%;display:block;border-radius:18px;pointer-events:none}
.badge{display:inline-block;background:#eff7dd;padding:7px 11px;border-radius:99px;font-weight:700}
.level{border:2px solid #ebe7e1;border-radius:18px;padding:20px;margin:14px 0}.done{border-color:var(--l)}
.task{font-size:20px;font-weight:700;margin:15px 0}.answer{width:min(100%,360px);padding:12px;border:2px solid #ddd6cd;border-radius:11px;font-size:18px}
.check,.next,.choice button{border:0;border-radius:11px;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer}
.check{background:var(--o);color:#fff;margin-left:6px}.next{background:var(--l);color:#fff;margin-top:15px}
.choice{display:grid;gap:9px;max-width:560px}.choice button{background:#f1efeb;color:var(--g);text-align:left}
.feedback{min-height:25px;margin-top:10px;font-weight:700}.center{text-align:center}.start{max-width:760px;margin:8vh auto}
.progress{font-size:14px;color:#777;font-weight:700}.letter{font-size:36px;font-weight:900;color:var(--o);letter-spacing:5px}
table th,table td{padding:10px;border-bottom:1px solid #ebe7e1;text-align:left}table th{background:#f1efeb}
</style></head><body><div id="app"></div><script>
"use strict";
const rooms=[{"name":"Клас","image":"assets/classroom.png","letter":"П","levels":[{"name":"Рівень 1. Множення та ділення","tasks":[{"type":"input","q":"6 × 7 = ?","a":"42"},{"type":"input","q":"48 ÷ 6 = ?","a":"8"},{"type":"input","q":"9 × 7 = ?","a":"63"},{"type":"input","q":"72 ÷ 9 = ?","a":"8"},{"type":"input","q":"8 × 12 = ?","a":"96"}]},{"name":"Рівень 2. Дроби з однаковими знаменниками","tasks":[{"type":"input","q":"2/7 + 3/7 = ?","a":"5/7"},{"type":"input","q":"6/9 − 2/9 = ?","a":"4/9"},{"type":"input","q":"1/8 + 5/8 = ?","a":"6/8"},{"type":"input","q":"7/10 − 3/10 = ?","a":"4/10"},{"type":"input","q":"3/11 + 4/11 = ?","a":"7/11"}]},{"name":"Рівень 3. Легкі рівняння","tasks":[{"type":"input","q":"x + 17 = 25. Знайди x.","a":"8"},{"type":"input","q":"x − 9 = 14. Знайди x.","a":"23"},{"type":"input","q":"4x = 28. Знайди x.","a":"7"},{"type":"input","q":"x / 5 = 6. Знайди x.","a":"30"},{"type":"input","q":"32 − x = 19. Знайди x.","a":"13"}]}]},{"name":"Коридор","image":"assets/corridor.png","letter":"А","levels":[{"name":"Рівень 1. Геометричні головоломки","tasks":[{"type":"input","q":"У трикутника кути 50° і 60°. Третій кут — ? °","a":"70"},{"type":"input","q":"Прямий кут — ? °","a":"90"},{"type":"input","q":"Скільки сторін має шестикутник?","a":"6"},{"type":"input","q":"Периметр квадрата зі стороною 5 см — ? см","a":"20"},{"type":"choice","q":"Яка фігура має 4 рівні сторони і 4 прямі кути?","opts":["Прямокутник","Квадрат","Трикутник"],"a":"Квадрат"}]},{"name":"Рівень 2. Вимірювання та час","tasks":[{"type":"input","q":"3 м = ? см","a":"300"},{"type":"input","q":"2 км = ? м","a":"2000"},{"type":"input","q":"4 м 50 см = ? см","a":"450"},{"type":"input","q":"2 год 15 хв = ? хв","a":"135"},{"type":"input","q":"150 хв — це скільки повних годин?","a":"2"}]},{"name":"Рівень 3. Математичний код","tasks":[{"type":"choice","q":"Продовж ряд: 2, 4, 8, 16, ?","opts":["20","24","32"],"a":"32"},{"type":"choice","q":"Яке число зайве: 12, 18, 24, 31, 36?","opts":["12","24","31"],"a":"31"},{"type":"choice","q":"Який знак треба поставити: 3/5 __ 4/5","opts":["<",">","="],"a":"<"},{"type":"input","q":"Знайди число: воно парне, більше за 30, менше за 40 і ділиться на 4.","a":"32"},{"type":"choice","q":"У якому рядку всі числа кратні 3?","opts":["8, 12, 15","9, 18, 27","10, 20, 30"],"a":"9, 18, 27"}]}]},{"name":"Кабінет","image":"assets/office.png","letter":"Т","levels":[{"name":"Рівень 1. Легкі відсотки","tasks":[{"type":"input","q":"10% від 80 = ?","a":"8"},{"type":"input","q":"25% від 40 = ?","a":"10"},{"type":"input","q":"50% від 36 = ?","a":"18"},{"type":"input","q":"20% від 150 = ?","a":"30"},{"type":"input","q":"5% від 200 = ?","a":"10"}]},{"name":"Рівень 2. Частина числа","tasks":[{"type":"input","q":"3/4 від 20 = ?","a":"15"},{"type":"input","q":"2/5 від 30 = ?","a":"12"},{"type":"input","q":"1/3 від 27 = ?","a":"9"},{"type":"input","q":"5/6 від 24 = ?","a":"20"},{"type":"input","q":"3/8 від 32 = ?","a":"12"}]},{"name":"Рівень 3. Числові головоломки","tasks":[{"type":"choice","q":"Який дріб дорівнює 1/2?","opts":["2/4","2/3","3/5"],"a":"2/4"},{"type":"input","q":"−3 + 8 = ?","a":"5"},{"type":"input","q":"7 − 12 = ?","a":"-5"},{"type":"choice","q":"Яке число найбільше?","opts":["0,7","0,65","0,75"],"a":"0,75"},{"type":"input","q":"Знайди 2/3 від 18.","a":"12"}]}]},{"name":"Таємна кімната","image":"assets/secret-room.png","letter":"А","levels":[{"name":"Рівень 1. Логічний код","tasks":[{"type":"input","q":"Число парне, більше за 20, менше за 30 і ділиться на 4. Яке це число?","a":"24"},{"type":"input","q":"Число непарне, більше за 30, менше за 40 і ділиться на 5. Яке це число?","a":"35"},{"type":"choice","q":"Яке число задовольняє всі умови: >15, <25, парне, кратне 3?","opts":["18","20","22"],"a":"18"},{"type":"choice","q":"Яке число треба вставити: 5, 10, 15, __, 25?","opts":["18","20","22"],"a":"20"},{"type":"input","q":"У числі 42 поміняли цифри місцями. Яке число отримали?","a":"24"}]},{"name":"Рівень 2. Логічні задачі","tasks":[{"type":"input","q":"У коробці було кілька олівців. Додали 7 — стало 19. Скільки було спочатку?","a":"12"},{"type":"input","q":"У класі 24 учні. 1/3 пішли до бібліотеки. Скільки залишилося?","a":"16"},{"type":"input","q":"Було число. Його помножили на 3 і отримали 45. Яке це число?","a":"15"},{"type":"choice","q":"У Марка 18 грн, а в Олі на 6 грн більше. Скільки гривень в Олі?","opts":["22","24","26"],"a":"24"},{"type":"choice","q":"У кошику 20 яблук. 5 з'їли. Яку частину яблук залишили?","opts":["1/4","3/4","4/5"],"a":"3/4"}]},{"name":"Рівень 3. Останній шифр","tasks":[{"type":"choice","q":"Продовж ряд: 1, 4, 9, 16, ?","opts":["20","25","30"],"a":"25"},{"type":"input","q":"У трьох коробках по 6 олівців. Скільки олівців разом?","a":"18"},{"type":"choice","q":"Було 40. Відняли 15, потім додали 5. Що отримали?","opts":["25","30","35"],"a":"30"},{"type":"choice","q":"Яке слово складають із літер П, А, Т, А?","opts":["ПАРТА","АТАП","ПАТАА"],"a":"ПАРТА"},{"type":"input","q":"12 + 8 × 2 = ?","a":"28"}]}]}];
let roomIndex=0,levelIndex=0,taskIndex=0,gameRooms=[],player={first:"",last:""},stats={correct:0,wrong:0,start:0},collectedLetters=[];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function randomizeQuest(){gameRooms.forEach(r=>r.levels.forEach(lv=>{shuffle(lv.tasks);lv.tasks.forEach(t=>{if(t.type==="choice")shuffle(t.opts);});}));}
const app=document.getElementById("app");
function start(){const first=document.getElementById("firstName"),last=document.getElementById("lastName");if(!first||!last||!first.value.trim()||!last.value.trim()){const f=document.getElementById("startFeedback");if(f)f.textContent="Будь ласка, введи ім’я та прізвище.";return;}player={first:first.value.trim(),last:last.value.trim()};gameRooms=JSON.parse(JSON.stringify(rooms));roomIndex=0;levelIndex=0;taskIndex=0;collectedLetters=[];stats={correct:0,wrong:0,start:Date.now()};randomizeQuest();renderRoom();}
function renderStart(){app.innerHTML=`<main><div class="card start center"><h1>Таємниця зниклого Спільношколярика</h1><p>Спільношколярик зник! Кажуть, він десь у школі, а знайти його можна лише пройшовши математичні рівні.</p><p>Працюй у своєму темпі. Тут немає змагання: розв'язуй завдання, проходь рівні та збирай літери.</p><input id="firstName" class="answer" type="text" placeholder="Ім’я" autocomplete="given-name"><br><br><input id="lastName" class="answer" type="text" placeholder="Прізвище" autocomplete="family-name"><br><br><button class="check" onclick="start()">Почати квест</button><div id="startFeedback" class="feedback"></div><p style="margin-top:28px"><button class="check" onclick="teacherLogin()">🔐 Кабінет учителя</button></p></div></main>`;}
const TEACHER_PASSWORD="SpilnoMath2026";
const RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbyjDYQrXmWRclj36WjA0HXIBCgZ6Izi2HnFJ385SYche9t5_mIsPIWKXsMxOLTxasOsHA/exec";
function teacherLogin(){const p=prompt("Введи пароль учителя:");if(p===TEACHER_PASSWORD)renderTeacher();else if(p!==null)alert("Неправильний пароль.");}
async function renderTeacher(){let data=JSON.parse(localStorage.getItem("spilnoQuestResults")||"[]");if(RESULTS_ENDPOINT){try{const res=await fetch(RESULTS_ENDPOINT+"?password="+encodeURIComponent(TEACHER_PASSWORD));const j=await res.json();if(j.success&&Array.isArray(j.results)){data=j.results.slice(1).map(r=>({name:r[1],correct:r[2],wrong:r[3],percent:r[4],minutes:r[5],date:r[0]}));}}catch(e){}}app.innerHTML=`<main><div class="wrap"><div class="card"><h2>🔐 Кабінет учителя</h2><p>${RESULTS_ENDPOINT?"Результати з Google Sheets.":"Поки підключені локальні результати цього пристрою. Після підключення Google Sheets вони будуть спільними для всіх учнів."}</p><button class="check" onclick="renderStart()">На початок</button> <button class="next" onclick="renderTeacher()">Оновити</button> <button class="next" onclick="clearResults()">Очистити локальні результати</button></div><div class="card"><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>Учень</th><th>Правильних</th><th>Помилок</th><th>Час</th><th>Результат</th></tr>${data.map(x=>`<tr><td>${x.name}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.minutes} хв</td><td>${x.percent}%</td></tr>`).join("")||"<tr><td colspan='5'>Поки немає результатів.</td></tr>"}</table></div></div></div></main>`;}
function clearResults(){if(confirm("Очистити всі локальні результати на цьому пристрої?")){localStorage.removeItem("spilnoQuestResults");renderTeacher();}}
function saveResult(){const total=60,percent=Math.round(stats.correct/total*100),item={name:player.first+" "+player.last,correct:stats.correct,wrong:stats.wrong,percent,minutes:Math.max(1,Math.round((Date.now()-stats.start)/60000)),date:new Date().toLocaleString("uk-UA")};const data=JSON.parse(localStorage.getItem("spilnoQuestResults")||"[]");data.push(item);localStorage.setItem("spilnoQuestResults",JSON.stringify(data));if(RESULTS_ENDPOINT){fetch(RESULTS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(item)}).catch(()=>{});}}
function renderRoom(){if(roomIndex>=rooms.length){renderFinal();return;}const r=gameRooms[roomIndex];let levels="";r.levels.forEach((lv,i)=>{let body="";if(i<levelIndex)body="<p>Рівень завершено ✓</p>";else if(i>levelIndex)body="<p>Цей рівень відкриється після попереднього.</p>";else body=renderTask(lv);levels+=`<section class="level ${i<levelIndex?"done":""}"><h3>${lv.name}</h3><div class="progress">Завдання ${Math.min(taskIndex+1,lv.tasks.length)} з ${lv.tasks.length}</div>${body}</section>`;});app.innerHTML=`<main><div class="wrap"><div class="card"><h2>${r.name}</h2><span class="badge">Кімната ${roomIndex+1} з ${rooms.length}</span></div><div class="card"><img class="scene" src="${r.image}" alt="${r.name}"></div><div class="card"><h2>Рівні</h2>${levels}</div></div></main>`;}
function renderTask(lv){const t=lv.tasks[taskIndex];if(t.type==="choice")return `<div class="task">${t.q}</div><div class="choice">${t.opts.map(o=>`<button onclick="checkChoice(${JSON.stringify(o)})">${o}</button>`).join("")}</div><div id="feedback" class="feedback"></div>`;return `<div class="task">${t.q}</div><input id="answer" class="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="Введи відповідь"><button class="check" onclick="checkInput()">Перевірити</button><div id="feedback" class="feedback"></div>`;}
function norm(v){return String(v).trim().replace(",",".").replace(/\s+/g,"").toLowerCase();}
function correct(){stats.correct++;const f=document.getElementById("feedback");if(f){f.textContent="Правильно! ✓";f.style.color="#6b8c24";}taskIndex++;setTimeout(()=>{if(taskIndex<gameRooms[roomIndex].levels[levelIndex].tasks.length)renderRoom();else{const r=gameRooms[roomIndex];if(r.letter)collectedLetters.push(r.letter);levelIndex++;taskIndex=0;if(levelIndex<gameRooms[roomIndex].levels.length)renderRoom();else{roomIndex++;levelIndex=0;taskIndex=0;renderRoom();}}},250);}
function wrong(){stats.wrong++;const f=document.getElementById("feedback");if(f){f.textContent="Спробуй ще раз 🙂";f.style.color="#d46b20";}}
function checkInput(){const t=gameRooms[roomIndex].levels[levelIndex].tasks[taskIndex],v=document.getElementById("answer").value;if(norm(v)===norm(t.a))correct();else wrong();}
function checkChoice(v){const t=gameRooms[roomIndex].levels[levelIndex].tasks[taskIndex];if(norm(v)===norm(t.a))correct();else wrong();}
function renderFinal(){app.innerHTML=`<main><div class="card start center"><h1>Фінальний шифр 🎉</h1><p>Ти пройшов усі математичні рівні та зібрав 5 літер.</p><div class="letter">${collectedLetters.join("")}</div><p>Введи слово, яке утворили літери:</p><input id="finalAnswer" class="answer" type="text" placeholder="Твоє слово"><button class="check" onclick="checkFinal()">Розшифрувати</button><div id="finalFeedback" class="feedback"></div></div></main>`;}
function checkFinal(){const v=document.getElementById("finalAnswer").value.trim().toUpperCase();const f=document.getElementById("finalFeedback");if(v==="ПАРТА"){saveResult();f.textContent="Розгадано! 🎉 Спільношколярик ховався біля парти!";f.style.color="#6b8c24";}else{f.textContent="Ще одна спроба — уважно подивись на літери 😉";f.style.color="#d46b20";}}
renderStart();
</script></body></html>
